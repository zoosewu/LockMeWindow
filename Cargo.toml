[package]
name = "window-warden"
version = "0.5.1"
edition = "2024"
license = "MIT"

[dependencies]
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Default features minus renderer-femtovg: the software renderer keeps the
# binary smaller and avoids the OpenGL path on machines with flaky drivers.
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-default",
    "renderer-software",
    "accessibility",
    "system-tray",
    "raw-window-handle-06",
] }
sys-locale = "0.3.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17.1"
winresource = { version = "0.1.31", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

[[bin]]
name = "window-warden"
path = "src/main.rs"
test = false
bench = false
